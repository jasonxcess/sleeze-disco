; Godot 3.5 export presets for Sleeze Disco.
; The PS Vita preset only appears in the editor once the SonicMastr
; godot-vita exporter is installed (godot 3.5-rc5, scons platform=vita).
; If the editor rejects an option key below, delete this preset and
; recreate it in Project > Export — the option keys vary slightly
; between godot-vita fork versions. The values that matter:
;   title_id SLEEZDSC1, 960x544, GLES2, all resources included.

[preset.0]

name="PS Vita"
platform="PlayStation Vita"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="/home/hatch/workspace/your_files/sleeze-disco-v7.6-vita.vpk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_mobile=true
vram_texture_compression/for_desktop=false
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=true
texture_format/etc2=true
texture_format/pvrtc=true
texture_format/astc=true
binary_format/architecture=0
variant/export_type=0
param_sfo/title="Sleeze Disco"
param_sfo/title_id="SLEEZDSC1"
param_sfo/parental_level=1
param_sfo/version="01.00"
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

