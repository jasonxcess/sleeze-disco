param_sfo/parental_level=0
param_sfo/version="01.02"
assets/bubble_icon_128x128="res://sce_sys/icon0.png"
assets/livearea_bg_840x500="res://sce_sys/bg.png"
assets/livearea_startup_button_280x158="res://sce_sys/startup.png"
progressive_web_app/enabled=false
