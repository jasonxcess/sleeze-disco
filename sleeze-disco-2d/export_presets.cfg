; Godot 3.5 export presets for Sleeze Disco 2D (SLZD00001).
; 2D fallback build — the "whatever it takes" build. Same proven flow as
; the 3D builds: godot-vita fork editor (3.5-rc5) under Xvfb, export the
; "Vita" preset, then repack with tools/make_vpk.py (the exporter writes
; a broken param.sfo — TITLE_ID gets the title string, APP_VER 00.00).

[preset.0]

name="Vita"
platform="PlayStation Vita"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*"
export_path="build/sleeze-disco-2d-v1.2-raw.vpk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_mobile=true
vram_texture_compression/for_desktop=false
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=true
texture_format/etc2=true
texture_format/pvrtc=true
texture_format/astc=true
binary_format/architecture=0
variant/export_type=0
param_sfo/title="SLEEZE DISCO 2D"
